<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Giọng Nói</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 400px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-break: break-word; white-space: pre-wrap; line-height: 1.4; }
        .user-message { background: #007bff; color: white; align-self: flex-end; }
        .ai-message { background: #e9ecef; color: black; align-self: flex-start; display: flex; flex-direction: column; gap: 5px; }
        .chat-input { display: flex; padding: 10px; gap: 5px; align-items: center; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; font-size: 14px; }
        .chat-input button { padding: 10px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .chat-input button#micBtn { background: #28a745; }
        .chat-input button#micBtn.recording { background: #dc3545; animation: pulse 1.5s infinite; }
        .speak-btn { background: none; border: none; color: #007bff; cursor: pointer; font-size: 12px; padding: 0; align-self: flex-start; margin-top: 4px; text-decoration: underline; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message ai-message">
            <span>Xin chào! Tôi là AI chatbot hỗ trợ giọng nói. Bạn có thể gõ phím hoặc bấm nút Mic để nói chuyện với tôi nhé!</span>
        </div>
    </div>
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Nhập hoặc nói tin nhắn..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button id="micBtn" onclick="toggleMic()" title="Nói chuyện">🎙️</button>
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    const part1 = "AQ.Ab8RN6LSW5VVItf02beSbluvaDXhEE";
    const part2 = "DFdEHEKYTp-YYOggVEcw";
    const API_KEY = part1 + part2;

    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'vi-VN';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {
            isRecording = true;
            document.getElementById('micBtn').classList.add('recording');
            document.getElementById('userInput').placeholder = "Đang lắng nghe...";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById('userInput').value = transcript;
            stopRecordingUI();
            sendMessage();
        };

        recognition.onerror = function(event) {
            console.error('Lỗi Mic:', event.error);
            stopRecordingUI();
            alert("Lỗi Micro: " + event.error);
        };

        recognition.onend = function() {
            stopRecordingUI();
        };
    }

    function toggleMic() {
        if (!recognition) {
            alert("Trình duyệt di động này không hỗ trợ Speech Recognition. Bạn thử dùng Chrome trên Android nhé!");
            return;
        }

        if (isRecording) {
            recognition.stop();
            stopRecordingUI();
        } else {
            try {
                recognition.start();
            } catch (e) {
                console.error(e);
                stopRecordingUI();
            }
        }
    }

    function stopRecordingUI() {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
        document.getElementById('userInput').placeholder = "Nhập hoặc nói tin nhắn...";
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'vi-VN';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = inputField.value.trim();
        
        if (!text) return;

        chatBox.innerHTML += `<div class="message user-message">${escapeHtml(text)}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        const aiMessageDiv = document.createElement('div');
        aiMessageDiv.className = 'message ai-message';
        const textSpan = document.createElement('span');
        textSpan.textContent = 'Đang suy nghĩ...';
        aiMessageDiv.appendChild(textSpan);
        chatBox.appendChild(aiMessageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                const aiReply = data.candidates[0].content.parts[0].text;
                textSpan.textContent = aiReply;

                const speakButton = document.createElement('button');
                speakButton.className = 'speak-btn';
                speakButton.textContent = '🔊 Nghe giọng đọc';
                speakButton.onclick = () => speakText(aiReply);
                aiMessageDiv.appendChild(speakButton);

                speakText(aiReply);
            } else if (data.error) {
                textSpan.innerHTML = `<span style="color: red;">Lỗi API: ${data.error.message || JSON.stringify(data.error)}</span>`;
            } else {
                textSpan.textContent = "Không nhận được phản hồi phù hợp từ AI.";
            }
        } catch (error) {
            console.error(error);
            textSpan.textContent = "Không thể kết nối mạng: " + error.message;
        }
        
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
